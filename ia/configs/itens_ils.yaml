# Parâmetros empíricos dos 44 itens do ILS, usados para calibrar o gerador 2PL.
#
# r : correlação item-total CORRIGIDA de cada item (coluna "Corrected
#     Item-Total Correlation" da Tabela 3 de Litzinger et al., 2005).
#     Amostra: 572 respondentes da Penn State, cerca de 80% graduandos.
# p : proporção de respondentes que marcam "a". O artigo NÃO publica esse
#     valor por item; usamos 0,50 (população equilibrada entre os polos) e
#     isso é declarado como limitação no texto.
#
# Observação: o item 40 tem r = −0,0105 (praticamente zero). O gerador o
# modela com r_minimo (ver configs/gerador.yaml): um item quase aleatório.

status: PUBLICADO          # PLACEHOLDER | PUBLICADO

fonte: >
  LITZINGER, T. A.; LEE, S. H.; WISE, J. C.; FELDER, R. M. A study of the
  reliability and validity of the Felder-Soloman Index of Learning Styles.
  In: ASEE Annual Conference & Exposition, 2005. Proceedings... p. 10.95.1-10.95.13.
  Tabela 3 (Output of Classical Item Analysis).

# A Tabela 3 reporta correlação CORRIGIDA (item × soma dos outros 10 itens).
tipo_correlacao: item_resto

itens:
  # dimensão ativo/reflexivo: itens 1, 5, 9, ..., 41
  # dimensão sensorial/intuitivo: itens 2, 6, 10, ..., 42
  # dimensão visual/verbal: itens 3, 7, 11, ..., 43
  # dimensão sequencial/global: itens 4, 8, 12, ..., 44
