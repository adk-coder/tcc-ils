# Publicação no Render (Blueprint): o Render lê este arquivo e cria os dois serviços.
# Banco: PostgreSQL gratuito no Neon (região São Paulo), informado em DATABASE_URL.
# Valores marcados com "sync: false" são preenchidos no painel do Render (nunca no git).
services:
  # ---------------------------------------------------------------- API (FastAPI)
  - type: web
    name: matif-api
    runtime: python
    plan: free
    region: virginia              # o Render não tem região no Brasil; Virgínia (EUA) é a mais próxima
    rootDir: plataforma/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AMBIENTE
        value: producao
      - key: SEGREDO_JWT
        generateValue: true       # o Render gera um segredo aleatório
      - key: DATABASE_URL
        sync: false               # cole a "connection string" do Neon
      - key: ORIGENS_CORS
        sync: false               # endereço do site, ex.: https://matif-web.onrender.com

  # ---------------------------------------------------------------- site (Nuxt, PWA)
  - type: web
    name: matif-web
    runtime: static
    rootDir: plataforma/frontend
    buildCommand: npm ci && npm run generate
    staticPublishPath: .output/public
    routes:                       # SPA: qualquer rota (ex.: /salas/3) abre o app
      - type: rewrite
        source: /*
        destination: /index.html
    headers:                      # o service worker não pode ficar em cache, senão o app não atualiza
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NUXT_PUBLIC_API_BASE
        sync: false               # endereço da API, ex.: https://matif-api.onrender.com
